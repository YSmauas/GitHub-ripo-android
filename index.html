<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דחיפת ZIP ל-GitHub</title>
<style>
  :root{
    --bg: #050a06;
    --glass-bg: rgba(20, 35, 25, 0.45);
    --glass-border: rgba(46, 160, 67, 0.25);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    
    --text: #e6edf3;
    --muted: #a3b3c4;
    --green: #2ea043;
    --green-hover: #3fb950;
    --green-glow: 0 0 15px rgba(63, 185, 80, 0.4);
    --blue: #58a6ff;
    --red: #f85149;
    
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  
  *{box-sizing:border-box;}
  
  html, body {
    margin:0; padding:0; color:var(--text);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    background-color: var(--bg);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -15%; right: -10%;
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(46, 160, 67, 0.15) 0%, transparent 60%);
    filter: blur(80px);
    z-index: -1;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -15%; left: -10%;
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, rgba(13, 110, 253, 0.1) 0%, transparent 60%);
    filter: blur(80px);
    z-index: -1;
  }

  body{
    padding: 30px 16px calc(50px + env(safe-area-inset-bottom,0px));
    padding-top: calc(30px + env(safe-area-inset-top,0px));
    max-width: 780px; margin: 0 auto;
  }

  h1{
    font-size: 24px; font-weight: 700; margin: 0 0 6px;
    display:flex; align-items:center; gap:12px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  h1 .dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--green); flex:none;
    box-shadow: 0 0 10px var(--green);
  }
  
  .sub{color:var(--muted); font-size:14px; margin:0 0 24px; line-height:1.6;}
  .sub b{color:var(--text); font-weight:600;}

  /* Header Rate Limit Tag */
  .rate-limit-bar {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-family: var(--mono);
    margin-bottom: 20px; color: var(--muted);
  }
  .rate-limit-bar span { color: var(--blue); font-weight: bold; }

  section, .progress-wrap, .log {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 16px;
    padding: 20px; 
    margin-bottom: 20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  section:hover {
    box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    border-color: rgba(46, 160, 67, 0.4);
  }

  section h2{
    font-size:16px; font-weight:650; margin:0 0 16px; color:var(--text);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 10px;
  }
  
  label{
    display:block; font-size:13px; color:var(--muted); margin:0 0 6px;
  }
  
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  
  input[type=text], input[type=password], textarea, select {
    width:100%; 
    background: rgba(0, 0, 0, 0.25); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    color:var(--text); 
    border-radius: 10px; 
    padding:12px 14px; 
    font-size:14px;
    font-family:var(--mono);
    transition: all 0.3s ease;
  }
  textarea{resize:vertical; min-height:60px; font-family:var(--sans);}
  input:focus, textarea:focus, select:focus{
    outline: none;
    border-color: var(--green);
    box-shadow: var(--green-glow);
    background: rgba(0, 0, 0, 0.4);
  }
  
  .row{display:flex; gap:12px;}
  .row > .field{flex:1; min-width:0;}

  .mode{display:flex; gap:10px; margin-bottom:16px;}
  .mode label{
    flex:1; display:flex; align-items:center; gap:8px; cursor:pointer;
    border: 1px solid rgba(255,255,255,0.1); 
    background: rgba(0,0,0,0.2);
    border-radius:10px; padding:12px;
    color:var(--muted); font-size:14px; margin:0;
    transition: all 0.3s ease;
  }
  .mode input{margin:0; accent-color: var(--green);}
  .mode label.active{
    border-color: var(--green); 
    background: rgba(46, 160, 67, 0.15);
    color: var(--text);
    box-shadow: inset 0 0 10px rgba(46, 160, 67, 0.1);
  }

  .drop{
    border: 2px dashed rgba(46, 160, 67, 0.4); 
    background: rgba(46, 160, 67, 0.03);
    border-radius: 12px; padding: 26px 14px;
    text-align:center; color:var(--muted); font-size:14px; cursor:pointer;
    transition: all 0.3s ease;
  }
  .drop:hover{
    border-color: var(--green-hover); 
    color:var(--text);
    background: rgba(46, 160, 67, 0.08);
    box-shadow: inset 0 0 20px rgba(46, 160, 67, 0.1);
  }
  .drop input{display:none;}

  /* תצוגת עץ תיקיות */
  .filetree{
    margin-top:16px; max-height:260px; overflow-y:auto; 
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08); 
    border-radius:10px; padding: 10px;
    font-family: var(--mono); font-size: 13px;
  }
  .tree-node { margin-right: 14px; }
  .tree-folder { font-weight: bold; color: var(--blue); margin: 4px 0; cursor: pointer; }
  .tree-file { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--text); }
  .tree-file input { accent-color: var(--green); }
  .tree-file em { color: var(--muted); font-style: normal; margin-inline-start: auto; font-size: 11.5px; }

  .toggle{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-top:14px; color:var(--muted); cursor: pointer;}
  .toggle input{flex:none; accent-color: var(--green);}
  .toggle:hover { color: var(--text); }

  button.primary{
    width:100%; 
    background: linear-gradient(135deg, var(--green) 0%, #238636 100%);
    color:#fff; border: 1px solid rgba(255,255,255,0.2); 
    border-radius:12px; padding:14px; 
    font-size:16px; font-weight:600; cursor:pointer; font-family:var(--sans);
    transition: all 0.3s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    box-shadow: 0 4px 15px rgba(46, 160, 67, 0.2);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary:hover:not(:disabled){
    background: linear-gradient(135deg, var(--green-hover) 0%, var(--green) 100%);
    box-shadow: var(--green-glow), 0 6px 20px rgba(46, 160, 67, 0.4);
    transform: translateY(-1px);
  }
  button.primary:disabled{
    background: rgba(33, 73, 43, 0.5); 
    color:rgba(255,255,255,0.3); 
    cursor:not-allowed;
    border-color: transparent;
    box-shadow: none;
    transform: none;
  }

  /* Spinner */
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-wrap{ margin-top:20px; padding: 16px; display:none; }
  .progress-label{
    display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px;
    color:var(--text); margin-bottom:10px; direction:ltr;
  }
  .progress-track{
    background: rgba(0,0,0,0.4); 
    border: 1px solid rgba(255,255,255,0.1);
    border-radius:8px; height:10px; overflow:hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .progress-fill{
    background: linear-gradient(90deg, var(--green), #56d364); 
    height:100%; width:0%; transition:width .2s ease;
    box-shadow: 0 0 10px rgba(86, 211, 100, 0.6);
  }

  .log{
    margin-top:20px; padding:16px; font-family:var(--mono); font-size:13px; color:#c9d1d9;
    max-height:280px; overflow-y:auto; direction:ltr; text-align:left;
  }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
  .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  
  .log .l{padding:3px 0; white-space:pre-wrap; word-break:break-word; border-bottom: 1px solid rgba(255,255,255,0.03);}
  .log .l:last-child { border-bottom: none; }
  .log .ok{color:var(--green-hover); text-shadow: 0 0 5px rgba(63,185,80,0.3);}
  .log .err{color:var(--red); text-shadow: 0 0 5px rgba(248,81,73,0.3);}
  .log .info{color:var(--blue); text-shadow: 0 0 5px rgba(88,166,255,0.3);}

  .result{
    margin-top:20px; padding:16px; border-radius:12px; font-size:14.5px;
    background: rgba(46, 160, 67, 0.15); 
    border: 1px solid rgba(46, 160, 67, 0.5); 
    color:var(--text);
    backdrop-filter: blur(10px);
    box-shadow: var(--green-glow);
  }
  .result a{color:var(--blue); font-weight: 600; text-decoration: none;}
  .result a:hover { text-decoration: underline; }

  .hint{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .clearlink{
    background:none; border:none; color:var(--blue); font-size:13px; font-family:var(--sans);
    cursor:pointer; padding:10px 0 0; margin:0; transition: color 0.2s;
  }
  .clearlink:hover{color: #79c0ff; text-decoration:underline;}

  /* מערכת התראות צפות (Toasts) */
  #toastContainer {
    position: fixed; top: 20px; left: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 10px; max-width: 320px;
  }
  .toast {
    background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border); color: var(--text);
    padding: 12px 16px; border-radius: 10px; font-size: 13.5px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    animation: fadeIn 0.3s ease, fadeOut 0.3s ease 3.7s forwards;
  }
  .toast-success { border-color: var(--green); }
  .toast-error { border-color: var(--red); }
  .toast-info { border-color: var(--blue); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

</style>
</head>
<body>

  <div id="toastContainer"></div>

  <h1><span class="dot"></span>ZIP → קומיט ל-GitHub</h1>
  <p class="sub">
    מעלים קובץ ZIP, והדף בונה מתוכו <b>קומיט אחד</b> דרך ה-API של GitHub.
  </p>

  <div class="rate-limit-bar">
    GitHub API Rate Limit: <span id="rateLimitVal">לא נבדק</span>
  </div>

  <section>
    <h2>חיבור</h2>
    <div class="row">
      <div class="field" style="flex: 2;">
        <label for="token">Personal access token (עם הרשאת repo)</label>
        <input type="password" id="token" autocomplete="off" placeholder="ghp_...">
      </div>
      <div class="field" style="flex: 1; display: flex; align-items: flex-end;">
        <button type="button" class="primary" id="fetchReposBtn" style="padding: 12px; font-size: 14px; margin: 0;">
          <span class="spinner" id="repoSpinner"></span>
          <span id="fetchBtnText">טען פרויקטים</span>
        </button>
      </div>
    </div>
    <div class="field">
      <label for="repoSelect">בחר ריפו (פרויקט)</label>
      <select id="repoSelect">
        <option value="">יש להזין טוקן וללחוץ על טעינה</option>
      </select>
    </div>
    <div class="field">
      <label for="base">ברנץ' בסיס (מזוהה אוטומטית)</label>
      <input type="text" id="base" value="main">
    </div>
  </section>

  <section>
    <h2>פעולה</h2>
    <div class="mode">
      <label id="modeCommitLbl"><input type="radio" name="mode" value="commit" checked> קומיט ישיר לברנץ'</label>
      <label id="modePrLbl"><input type="radio" name="mode" value="pr"> ברנץ' חדש + Pull Request</label>
    </div>
    <div class="field" id="newBranchField" style="display:none;">
      <label for="newBranch">שם הברנץ' החדש</label>
      <input type="text" id="newBranch" placeholder="update-from-phone">
    </div>
    <div class="field">
      <label for="msg">הודעת קומיט</label>
      <input type="text" id="msg" placeholder="עדכון מהטלפון">
    </div>
    <div class="field" id="prTitleField" style="display:none;">
      <label for="prTitle">כותרת ה-PR</label>
      <input type="text" id="prTitle" placeholder="עדכון מהטלפון">
    </div>
    <div class="field">
      <label for="prefix">תיקיית יעד בריפו (רשות, למשל src/)</label>
      <input type="text" id="prefix" placeholder="ריק = שורש הריפו">
    </div>
  </section>

  <section>
    <h2>קבצים וסינון</h2>
    <div class="field">
      <label for="ignorePatterns">תבניות להתעלמות / סינון (מופרדות בסימן פסיק)</label>
      <input type="text" id="ignorePatterns" placeholder="node_modules/, *.map, .DS_Store, .git/">
    </div>
    <div class="drop" id="drop">
      <input type="file" id="zipInput" multiple>
      <span id="dropText">הקישו כדי לבחור ZIP ו/או קבצים בודדים, או גררו לכאן</span>
    </div>
    <label class="toggle"><input type="checkbox" id="stripRoot"> להסיר תיקיית-שורש משותפת מתוך ZIP</label>
    
    <div class="filetree" id="fileTree" style="display:none;"></div>
    <div class="hint" id="fileHint"></div>
    <button type="button" class="clearlink" id="clearAll" style="display:none;">נקו את כל הרשימה</button>
  </section>

  <button class="primary" id="pushBtn" disabled>
    <span class="spinner" id="pushSpinner"></span>
    <span id="pushBtnText">בחרו קבצים כדי להמשיך</span>
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label"><span id="progressText">מעלה קבצים...</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="log" id="log" style="display:none;"></div>
  <div class="result" id="result" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const modeRadios = document.querySelectorAll('input[name=mode]');
  const newBranchField = $('newBranchField');
  const prTitleField = $('prTitleField');
  const modeCommitLbl = $('modeCommitLbl');
  const modePrLbl = $('modePrLbl');
  const dropEl = $('drop');
  const dropText = $('dropText');
  const zipInput = $('zipInput');
  const stripRootCk = $('stripRoot');
  const fileTreeEl = $('fileTree');
  const fileHint = $('fileHint');
  const pushBtn = $('pushBtn');
  const logEl = $('log');
  const resultEl = $('result');
  const progressWrap = $('progressWrap');
  const progressText = $('progressText');
  const progressPct = $('progressPct');
  const progressFill = $('progressFill');
  const fetchReposBtn = $('fetchReposBtn');
  const repoSelect = $('repoSelect');
  const ignorePatternsInput = $('ignorePatterns');

  let entries = []; // {path, base64, checked}
  let commonRoot = '';
  let reposCache = [];

  // Toast Notification System
  function showToast(msg, type = 'info'){
    const container = $('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  // LocalStorage - טעינת נתונים שמורים
  window.addEventListener('DOMContentLoaded', () => {
    const savedToken = localStorage.getItem('gh_token');
    const savedRepo = localStorage.getItem('gh_repo');
    const savedIgnore = localStorage.getItem('gh_ignore');
    
    if (savedToken) $('token').value = savedToken;
    if (savedIgnore) ignorePatternsInput.value = savedIgnore;
    
    if (savedToken) {
      loadRepos(savedToken, savedRepo);
    }
  });

  $('token').addEventListener('change', () => {
    localStorage.setItem('gh_token', $('token').value.trim());
  });

  ignorePatternsInput.addEventListener('change', () => {
    localStorage.setItem('gh_ignore', ignorePatternsInput.value.trim());
    renderFileList();
  });

  function showProgress(text, done, total){
    progressWrap.style.display = '';
    const pct = total ? Math.round((done / total) * 100) : 0;
    progressText.textContent = text + ' (' + done + '/' + total + ')';
    progressPct.textContent = pct + '%';
    progressFill.style.width = pct + '%';
  }
  function hideProgress(){
    progressWrap.style.display = 'none';
    progressFill.style.width = '0%';
  }

  function updateModeUI(){
    const mode = document.querySelector('input[name=mode]:checked').value;
    newBranchField.style.display = mode === 'pr' ? '' : 'none';
    prTitleField.style.display = mode === 'pr' ? '' : 'none';
    modeCommitLbl.classList.toggle('active', mode === 'commit');
    modePrLbl.classList.toggle('active', mode === 'pr');
  }
  modeRadios.forEach(r => r.addEventListener('change', updateModeUI));
  updateModeUI();

  dropEl.addEventListener('click', () => zipInput.click());
  dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.style.borderColor = 'var(--green-hover)'; });
  dropEl.addEventListener('dragleave', () => { dropEl.style.borderColor = ''; });
  dropEl.addEventListener('drop', e => {
    e.preventDefault(); dropEl.style.borderColor = '';
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
  zipInput.addEventListener('change', () => {
    if (zipInput.files.length) handleFiles(zipInput.files);
    zipInput.value = '';
  });
  $('clearAll').addEventListener('click', () => {
    entries = []; commonRoot = '';
    renderFileList();
    dropText.textContent = 'הקישו כדי לבחור ZIP ו/או קבצים בודדים, או גררו לכאן';
    pushBtn.disabled = true;
    $('pushBtnText').textContent = 'בחרו קבצים כדי להמשיך';
  });

  function log(msg, cls){
    logEl.style.display = '';
    const d = document.createElement('div');
    d.className = 'l' + (cls ? ' ' + cls : '');
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function arrayBufferToBase64(buf){
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function addOrReplaceEntry(path, base64){
    const existing = entries.find(e => e.path === path);
    if (existing){
      existing.base64 = base64;
      existing.checked = true;
    } else {
      entries.push({ path, base64, checked: true });
    }
  }

  async function handleFiles(fileList){
    const files = Array.from(fileList);
    dropText.textContent = 'קורא קבצים ...';
    try{
      for (const file of files){
        const isZip = file.name.toLowerCase().endsWith('.zip') ||
                      file.type === 'application/zip' || file.type === 'application/x-zip-compressed';
        if (isZip){
          const zip = await JSZip.loadAsync(file);
          const paths = []; const tasks = [];
          zip.forEach((relPath, zEntry) => {
            if (zEntry.dir) return;
            if (relPath.startsWith('__MACOSX/') || relPath.endsWith('.DS_Store')) return;
            paths.push(relPath);
            tasks.push(zEntry.async('arraybuffer').then(buf => addOrReplaceEntry(relPath, arrayBufferToBase64(buf))));
          });
          await Promise.all(tasks);

          if (paths.length){
            const first = paths[0].split('/');
            if (first.length > 1){
              const candidate = first[0] + '/';
              if (paths.every(p => p.startsWith(candidate))) commonRoot = candidate;
            }
          }
        } else {
          const relPath = file.webkitRelativePath && file.webkitRelativePath.length ? file.webkitRelativePath : file.name;
          const buf = await file.arrayBuffer();
          addOrReplaceEntry(relPath, arrayBufferToBase64(buf));
        }
      }
      stripRootCk.checked = !!commonRoot;
      renderFileList();
      dropText.textContent = entries.length + ' קבצים ברשימה — הקישו כדי להוסיף עוד';
      pushBtn.disabled = entries.length === 0;
      $('pushBtnText').textContent = 'דחיפה ל-GitHub';
      showToast('הקבצים נטענו בהצלחה', 'success');
    }catch(err){
      dropText.textContent = 'שגיאה בקריאת הקבצים';
      showToast('שגיאה בקריאת הקבצים: ' + err.message, 'error');
    }
  }

  function isIgnored(path) {
    const patterns = ignorePatternsInput.value.split(',').map(p => p.trim()).filter(Boolean);
    return patterns.some(pat => {
      if (pat.endsWith('/') && path.includes(pat)) return true;
      if (pat.startsWith('*') && path.endsWith(pat.slice(1))) return true;
      return path.includes(pat);
    });
  }

  function displayPath(p){
    if (stripRootCk.checked && commonRoot && p.startsWith(commonRoot)){
      return p.slice(commonRoot.length);
    }
    return p;
  }

  // תצוגת עץ תיקיות (Tree View)
  function renderFileList(){
    fileTreeEl.style.display = entries.length ? '' : 'none';
    $('clearAll').style.display = entries.length ? '' : 'none';
    fileTreeEl.innerHTML = '';

    const filtered = entries.filter(e => !isIgnored(displayPath(e.path)));

    if (!filtered.length && entries.length) {
      fileTreeEl.innerHTML = '<div style="color:var(--muted); padding:5px;">כל הקבצים סוננו לפי התבניות.</div>';
      return;
    }

    // ביוני עץ תיקיות היררכי
    const tree = {};
    filtered.forEach((e, idx) => {
      const parts = displayPath(e.path).split('/');
      let curr = tree;
      parts.forEach((part, i) => {
        if (i === parts.length - 1) {
          curr[part] = { _entry: e, _idx: entries.indexOf(e) };
        } else {
          curr[part] = curr[part] || {};
          curr = curr[part];
        }
      });
    });

    function buildTreeHTML(node) {
      let html = '';
      for (const key in node) {
        if (node[key]._entry) {
          const e = node[key]._entry;
          const i = node[key]._idx;
          const kb = Math.max(1, Math.round(e.base64.length * 0.75 / 1024));
          html += `<div class="tree-file">
            <input type="checkbox" data-i="${i}" ${e.checked ? 'checked' : ''}>
            <span>📄 ${key}</span>
            <em>${kb} KB</em>
          </div>`;
        } else {
          html += `<div class="tree-node">
            <div class="tree-folder">📁 ${key}/</div>
            <div>${buildTreeHTML(node[key])}</div>
          </div>`;
        }
      }
      return html;
    }

    fileTreeEl.innerHTML = buildTreeHTML(tree);
    fileHint.textContent = filtered.length ? 'קבצים שסומנו ייכללו בקומיט.' : '';
  }

  fileTreeEl.addEventListener('change', e => {
    if (e.target.matches('input[type=checkbox]')){
      entries[parseInt(e.target.dataset.i, 10)].checked = e.target.checked;
    }
  });
  stripRootCk.addEventListener('change', renderFileList);

  // קריאה ל-API של GitHub כולל בדיקת Rate Limit
  async function gh(path, token, opts){
    opts = opts || {};
    const res = await fetch('https://api.github.com' + path, {
      method: opts.method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });

    // עדכון מחוון Rate Limit
    const remaining = res.headers.get('x-ratelimit-remaining');
    const limit = res.headers.get('x-ratelimit-limit');
    if (remaining && limit) {
      $('rateLimitVal').textContent = `${remaining} / ${limit}`;
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok){
      const msg = (data && data.message) ? data.message : ('HTTP ' + res.status);
      throw new Error(path + ' → ' + msg);
    }
    return data;
  }

  async function loadRepos(token, autoSelectRepo) {
    $('repoSpinner').style.display = 'inline-block';$('fetchBtnText').textContent = 'טוען...';
    fetchReposBtn.disabled = true;

    try {
      reposCache = await gh('/user/repos?sort=updated&per_page=100', token);
      repoSelect.innerHTML = '';
      if (!reposCache || reposCache.length === 0) {
        repoSelect.innerHTML = '<option value="">לא נמצאו פרויקטים</option>';
      } else {
        reposCache.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.full_name;
          opt.textContent = r.full_name;
          repoSelect.appendChild(opt);
        });
        if (autoSelectRepo) {
          repoSelect.value = autoSelectRepo;
          triggerRepoChange();
        } else if (reposCache.length > 0) {
          triggerRepoChange();
        }
        showToast('רשימת הפרויקטים נטענה', 'info');
      }
    } catch(err) {
      showToast('שגיאה בטעינת הפרויקטים: ' + err.message, 'error');
      repoSelect.innerHTML = '<option value="">שגיאה בטעינה</option>';
    } finally {
      $('repoSpinner').style.display = 'none';$('fetchBtnText').textContent = 'טען פרויקטים';
      fetchReposBtn.disabled = false;
    }
  }

  function triggerRepoChange() {
    const selected = repoSelect.value;
    if (!selected) return;
    localStorage.setItem('gh_repo', selected);
    
    // זיהוי ברנץ' אוטומטי מתוך הקאש
    const rData = reposCache.find(r => r.full_name === selected);
    if (rData && rData.default_branch) {
      $('base').value = rData.default_branch;
    }
  }

  fetchReposBtn.addEventListener('click', () => {
    const token = $('token').value.trim();
    if (!token) { showToast('נא להזין טוקן אישי תחילה.', 'error'); return; }
    loadRepos(token);
  });

  repoSelect.addEventListener('change', triggerRepoChange);

  function selectedEntries(){
    return entries.filter(e => e.checked && !isIgnored(displayPath(e.path)));
  }

  // העלאה מקבילית באצוות (Concurrent Uploading)
  async function uploadBlobsConcurrently(chosen, fullRepo, token, prefix) {
    const CONCURRENCY = 5; // עד 5 העלאות במקביל
    let done = 0;
    const tree = [];
    const queue = [...chosen];

    showProgress('מעלה קבצים (במקביל)', 0, chosen.length);

    async function worker() {
      while (queue.length > 0) {
        const e = queue.shift();
        const blob = await gh('/repos/' + fullRepo + '/git/blobs', token, {
          method: 'POST',
          body: { content: e.base64, encoding: 'base64' }
        });
        let p = displayPath(e.path);
        if (prefix) p = prefix + '/' + p;
        tree.push({ path: p, mode: '100644', type: 'blob', sha: blob.sha });
        
        done++;
        showProgress('מעלה קבצים (במקביל)', done, chosen.length);
        log('קובץ הועלה (' + done + '/' + chosen.length + '): ' + displayPath(e.path), 'info');
      }
    }

    const workers = Array(Math.min(CONCURRENCY, chosen.length)).fill(0).map(() => worker());
    await Promise.all(workers);
    return tree;
  }

  pushBtn.addEventListener('click', async () => {
    resultEl.style.display = 'none';
    logEl.innerHTML = '';
    logEl.style.display = '';
    hideProgress();

    const token = $('token').value.trim();
    const fullRepo = repoSelect.value;
    const base = $('base').value.trim() || 'main';
    const mode = document.querySelector('input[name=mode]:checked').value;
    const newBranch = $('newBranch').value.trim();
    const commitMsg = $('msg').value.trim() || 'עדכון מהטלפון';
    const prTitle = $('prTitle').value.trim() || commitMsg;
    const prefix = $('prefix').value.trim().replace(/^\/+\vert{}\/+$/g, '');

    if (!token || !fullRepo){
      showToast('נא למלא טוקן ולבחור ריפו מהרשימה.', 'error');
      return;
    }
    const chosen = selectedEntries();
    if (!chosen.length){
      showToast('לא נבחרו קבצים (או שכולם סוננו).', 'error');
      return;
    }

    pushBtn.disabled = true;
    $('pushSpinner').style.display = 'inline-block';$('pushBtnText').textContent = 'מעבד דחיפה...';
    const targetBranch = mode === 'pr' ? newBranch : base;

    try{
      log('שולף את ' + base + ' ...', 'info');
      const baseRef = await gh('/repos/' + fullRepo + '/git/ref/heads/' + base, token);
      const baseCommitSha = baseRef.object.sha;

      if (mode === 'pr'){
        log('יוצר ברנץ׳ ' + newBranch + ' ...', 'info');
        try{
          await gh('/repos/' + fullRepo + '/git/refs', token, {
            method: 'POST',
            body: { ref: 'refs/heads/' + newBranch, sha: baseCommitSha }
          });
        }catch(e){
          if (!e.message.includes('Reference already exists')) throw e;
        }
      }

      log('שולף את הברנץ׳ ' + targetBranch + ' ...', 'info');
      const targetRef = await gh('/repos/' + fullRepo + '/git/ref/heads/' + targetBranch, token);
      const parentCommitSha = targetRef.object.sha;
      const parentCommit = await gh('/repos/' + fullRepo + '/git/commits/' + parentCommitSha, token);
      const baseTreeSha = parentCommit.tree.sha;

      log('מעלה ' + chosen.length + ' קבצים במקביל ...', 'info');
      const tree = await uploadBlobsConcurrently(chosen, fullRepo, token, prefix);
      log('כל הקבצים הועלו בהצלחה.', 'ok');
      hideProgress();

      log('בונה עץ קבצים חדש ...', 'info');
      const newTree = await gh('/repos/' + fullRepo + '/git/trees', token, {
        method: 'POST',
        body: { base_tree: baseTreeSha, tree: tree }
      });

      log('יוצר קומיט ...', 'info');
      const newCommit = await gh('/repos/' + fullRepo + '/git/commits', token, {
        method: 'POST',
        body: { message: commitMsg, tree: newTree.sha, parents: [parentCommitSha] }
      });

      log('מעדכן את ' + targetBranch + ' ...', 'info');
      await gh('/repos/' + fullRepo + '/git/refs/heads/' + targetBranch, token, {
        method: 'PATCH',
        body: { sha: newCommit.sha, force: false }
      });

      let resultHtml = 'הקומיט נדחף בהצלחה: ' +
        '<a href="https://github.com/' + fullRepo + '/commit/' + newCommit.sha + '" target="_blank">' +
        newCommit.sha.slice(0,7) + '</a>';

      if (mode === 'pr'){
        log('פותח Pull Request ...', 'info');
        const pr = await gh('/repos/' + fullRepo + '/pulls', token, {
          method: 'POST',
          body: { title: prTitle, head: newBranch, base: base, body: '' }
        });
        resultHtml += '<br>Pull Request: <a href="' + pr.html_url + '" target="_blank">#' + pr.number + '</a>';
      }

      resultEl.innerHTML = resultHtml;
      resultEl.style.display = '';
      showToast('התהליך הושלם בהצלחה!', 'success');
    }catch(err){
      log('שגיאה: ' + err.message, 'err');
      showToast('שגיאה: ' + err.message, 'error');
      hideProgress();
    }finally{
      pushBtn.disabled = false;
      $('pushSpinner').style.display = 'none';$('pushBtnText').textContent = 'דחיפה ל-GitHub';
    }
  });
})();
</script>
