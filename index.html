<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitVault Pro — ניהול ודחיפת ZIP ל-GitHub</title>
<style>
  :root{
    color-scheme: dark;
    --canvas: #0d1117;
    --subtle: #161b22;
    --inset: #010409;
    --border: #30363d;
    --border-muted: #21262d;
    --text: #e6edf3;
    --muted: #8d96a0;
    --green: #238636;
    --green-hover: #2ea043;
    --blue: #58a6ff;
    --accent: #1f6feb;
    --red: #f85149;
    --btn-border: rgba(240,246,252,0.1);

    --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  html, body {
    margin:0; padding:0; color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    background-color: var(--canvas);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body{
    padding: 28px 16px calc(48px + env(safe-area-inset-bottom,0px));
    padding-top: calc(28px + env(safe-area-inset-top,0px));
    max-width: 780px; margin: 0 auto;
  }

  .icon { width:16px; height:16px; fill: currentColor; flex:none; vertical-align: text-bottom; }

  .header-brand {
    display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
  }
  .brand-icon { width: 32px; height: 32px; fill: var(--text); flex:none; }
  h1{ font-size: 24px; font-weight: 600; margin: 0; }

  .sub{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.6;}
  .sub b{color:var(--text); font-weight:600;}

  .rate-limit-bar {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: transparent;
    padding: 1px 10px; border-radius: 2em; font-size: 12px; font-weight: 500;
    margin-bottom: 16px; color: var(--muted);
  }
  .rate-limit-bar span { color: var(--blue); font-weight: 600; font-family: var(--mono); }

  section, .progress-wrap, .log {
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }

  section h2{
    font-size:14px; font-weight:600; color:var(--text);
    margin: -16px -16px 16px; padding: 12px 16px;
    background: var(--subtle);
    border-bottom: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
  }

  label{ display:block; font-size:14px; font-weight:600; color:var(--text); margin:0 0 6px; }

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}

  input[type=text], input[type=password], textarea, select {
    width:100%;
    background: var(--canvas);
    border: 1px solid var(--border);
    color:var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    min-height: 40px;
    font-size:14px;
    font-family:var(--mono);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: #6e7681; }
  textarea{resize:vertical; min-height:60px; font-family:var(--sans);}
  input:focus, textarea:focus, select:focus{
    outline: none;
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .row{display:flex; gap:12px;}
  .row > .field{flex:1; min-width:0;}

  .secondary-btn {
    background: var(--border-muted);
    border: 1px solid var(--btn-border);
    color: var(--text);
    border-radius: 6px;
    padding: 0 14px;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px;
  }
  .secondary-btn:hover:not(:disabled) { background: var(--border); border-color: #8b949e; }
  .secondary-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .mode{display:flex; gap:8px; margin-bottom:16px;}
  .mode label{
    flex:1; display:flex; align-items:center; gap:8px; cursor:pointer;
    border: 1px solid var(--border);
    background: var(--canvas);
    border-radius:6px; padding:10px 12px;
    color:var(--muted); font-size:14px; font-weight:400; margin:0;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .mode input{margin:0; accent-color: var(--accent);}
  .mode label.active{
    border-color: var(--accent);
    background: rgba(56,139,253,0.1);
    color: var(--text);
  }

  .drop{
    border: 1px dashed var(--border);
    background: var(--subtle);
    border-radius: 6px; padding: 24px 14px;
    text-align:center; color:var(--muted); font-size:14px; cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .drop:hover{ border-color: var(--blue); color:var(--text); }
  .drop input{display:none;}

  .filetree{
    margin-top:16px; max-height:260px; overflow-y:auto;
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius:6px; padding: 8px 12px;
    font-family: var(--mono); font-size: 13px;
  }
  .tree-node { margin-right: 16px; }
  .tree-folder { display:flex; align-items:center; gap:8px; font-weight: 600; color: var(--text); margin: 4px 0; cursor: pointer; }
  .tree-folder .icon { fill: #54aeff; }
  .tree-file { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--text); }
  .tree-file .icon { fill: var(--muted); }
  .tree-file input { accent-color: var(--accent); }
  .tree-file em { color: var(--muted); font-style: normal; margin-inline-start: auto; font-size: 12px; }

  .toggle{display:flex; align-items:center; gap:8px; font-size:14px; margin-top:12px; color:var(--muted); cursor: pointer; font-weight:400;}
  .toggle input{flex:none; accent-color: var(--accent);}
  .toggle:hover { color: var(--text); }

  button.primary{
    width:100%;
    background: var(--green);
    color:#fff; border: 1px solid var(--btn-border);
    border-radius:6px; padding:10px 16px; min-height:44px;
    font-size:14px; font-weight:600; cursor:pointer; font-family:var(--sans);
    transition: background-color .15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary:hover:not(:disabled){ background: var(--green-hover); }
  button.primary:disabled{
    background: rgba(35,134,54,0.4);
    color:rgba(255,255,255,0.5);
    cursor:not-allowed;
  }

  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-wrap{ margin-top:16px; display:none; }
  .progress-label{
    display:flex; justify-content:space-between; font-family:var(--mono); font-size:12px;
    color:var(--text); margin-bottom:8px; direction:ltr;
  }
  .progress-track{
    background: var(--border-muted);
    border-radius:6px; height:8px; overflow:hidden;
  }
  .progress-fill{
    background: var(--green-hover);
    height:100%; width:0%; transition:width .2s ease;
  }

  .log{
    margin-top:16px; font-family:var(--mono); font-size:12px; color:#c9d1d9;
    background: var(--inset);
    max-height:280px; overflow-y:auto; direction:ltr; text-align:left;
  }
  .log::-webkit-scrollbar { width: 10px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--inset); }

  .log .l{padding:2px 0; white-space:pre-wrap; word-break:break-word;}
  .log .ok{color:#3fb950;}
  .log .err{color:var(--red);}
  .log .info{color:var(--blue);}

  .result{
    margin-top:16px; padding:12px 16px; border-radius:6px; font-size:14px;
    background: rgba(46,160,67,0.15);
    border: 1px solid rgba(46,160,67,0.4);
    color:var(--text);
  }
  .result a{color:var(--blue); font-weight: 600; text-decoration: none;}
  .result a:hover { text-decoration: underline; }

  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .clearlink{
    background:none; border:none; color:var(--blue); font-size:13px; font-family:var(--sans);
    cursor:pointer; padding:10px 0 0; margin:0;
  }
  .clearlink:hover{text-decoration:underline;}

  /* Toasts */
  #toastContainer {
    position: fixed; top: 16px; left: 16px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px; max-width: 320px;
  }
  .toast {
    background: var(--subtle); color: var(--text);
    border: 1px solid var(--border); border-right: 3px solid var(--border);
    padding: 10px 14px; border-radius: 6px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(1,4,9,0.6);
    animation: fadeIn 0.25s ease, fadeOut 0.3s ease 3.7s forwards;
  }
  .toast-success { border-right-color: #3fb950; }
  .toast-error { border-right-color: var(--red); }
  .toast-info { border-right-color: var(--blue); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-8px); } }

  /* Modal */
  .modal-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(1,4,9,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--subtle); border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(1,4,9,0.85);
    border-radius: 12px; padding: 20px; width: 90%; max-width: 440px;
    transform: translateY(8px); transition: transform 0.2s ease;
  }
  .modal-overlay.active .modal-card { transform: translateY(0); }
  .modal-card h3 { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: var(--text); }
  .modal-card input[type=text] { background: var(--canvas); }

  .credit{
    text-align:center; margin-top:8px; padding-top:16px;
    border-top: 1px solid var(--border-muted);
    font-size:12px; color: var(--muted);
  }
  .credit a{ color: var(--blue); text-decoration:none; font-weight:600; }
  .credit a:hover{ text-decoration:underline; }

  .field-error{ color: var(--red); font-size:12px; margin-top:6px; line-height:1.5; }
  input.invalid{
    border-color: var(--red) !important;
    box-shadow: inset 0 0 0 1px var(--red) !important;
  }

  @media (max-width: 520px) {
    .row { flex-direction: column; gap: 0; }
    .mode { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

</style>
</head>
<body>

  <div id="toastContainer"></div>

  <div class="header-brand">
    <svg class="brand-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    <h1>GitVault Pro</h1>
  </div>
  <p class="sub">
    ניהול, סנכרון ודחיפת פרויקטים ב-<b>GitHub</b> ישירות מהדפדפן ללא התקנות.
  </p>

  <div class="rate-limit-bar">
    GitHub API Rate Limit: <span id="rateLimitVal">לא נבדק</span>
  </div>

  <section>
    <h2>חיבור ופרויקטים</h2>
    <div class="row">
      <div class="field" style="flex: 2;">
        <label for="token">Personal Access Token (עם הרשאת repo)</label>
        <input type="password" id="token" autocomplete="off" placeholder="ghp_...">
      </div>
      <div class="field" style="flex: 1; display: flex; align-items: flex-end;">
        <button type="button" class="primary" id="fetchReposBtn" style="padding: 12px; font-size: 14px; margin: 0; height: 44px;">
          <span class="spinner" id="repoSpinner"></span>
          <span id="fetchBtnText">טען פרויקטים</span>
        </button>
      </div>
    </div>
    
    <div class="field">
      <label for="repoSelect">בחר ריפו (פרויקט)</label>
      <div style="display:flex; gap:8px;">
        <select id="repoSelect" style="flex:1;">
          <option value="">יש להזין טוקן וללחוץ על טעינה</option>
        </select>
        <button type="button" class="secondary-btn" id="openNewRepoModalBtn" title="פתיחת מאגר חדש">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg> חדש
        </button>
        <button type="button" class="secondary-btn" id="downloadRepoBtn" title="הורד את הריפו כקובץ ZIP" disabled>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M7.47 10.78a.749.749 0 0 0 1.06 0l3.75-3.75a.749.749 0 1 0-1.06-1.06L8.75 8.439V1.75a.75.75 0 0 0-1.5 0v6.689L4.78 5.97a.749.749 0 1 0-1.06 1.06l3.75 3.75ZM3.75 13a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Z"/></svg> הורד ZIP
        </button>
      </div>
    </div>

    <div class="field">
      <label for="base">ברנץ' בסיס (מזוהה אוטומטית)</label>
      <input type="text" id="base" value="main">
    </div>
  </section>

  <section>
    <h2>הגדרות קומיט</h2>
    <div class="mode">
      <label id="modeCommitLbl"><input type="radio" name="mode" value="commit" checked> קומיט ישיר לברנץ'</label>
      <label id="modePrLbl"><input type="radio" name="mode" value="pr"> ברנץ' חדש + Pull Request</label>
    </div>
    <div class="field" id="newBranchField" style="display:none;">
      <label for="newBranch">שם הברנץ' החדש</label>
      <input type="text" id="newBranch" placeholder="update-from-web">
      <div class="field-error" id="newBranchError" style="display:none;"></div>
    </div>
    <div class="field">
      <label for="msg">הודעת קומיט</label>
      <input type="text" id="msg" placeholder="עדכון קבצים דרך GitVault">
    </div>
    <div class="field" id="prTitleField" style="display:none;">
      <label for="prTitle">כותרת ה-PR</label>
      <input type="text" id="prTitle" placeholder="עדכון קבצים">
    </div>
    <div class="field">
      <label for="prefix">תיקיית יעד בריפו (רשות, למשל src/)</label>
      <input type="text" id="prefix" placeholder="ריק = שורש הריפו">
    </div>
  </section>

  <section>
    <h2>קבצים וסינון</h2>
    <div class="field">
      <label for="ignorePatterns">תבניות להתעלמות / סינון (נטענות אוטומטית מ-.gitignore)</label>
      <input type="text" id="ignorePatterns" placeholder="משתנה אוטומטית מ-.gitignore או מוזן ידנית">
    </div>
    <div class="drop" id="drop">
      <input type="file" id="zipInput" multiple>
      <span id="dropText">הקישו כדי לבחור ZIP ו/או קבצים בודדים, או גררו לכאן</span>
    </div>
    <label class="toggle"><input type="checkbox" id="stripRoot"> להסיר תיקיית-שורש משותפת מתוך ZIP</label>
    
    <div class="filetree" id="fileTree" style="display:none;"></div>
    <div class="hint" id="fileHint"></div>
    <button type="button" class="clearlink" id="clearAll" style="display:none;">נקו את כל הרשימה</button>
  </section>

  <button class="primary" id="pushBtn" disabled>
    <span class="spinner" id="pushSpinner"></span>
    <span id="pushBtnText">בחרו קבצים כדי להמשיך</span>
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label"><span id="progressText">מעלה קבצים...</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="log" id="log" style="display:none;"></div>
  <div class="result" id="result" style="display:none;"></div>

  <!-- Modal ליצירת repository חדש -->
  <div class="modal-overlay" id="createRepoModal">
    <div class="modal-card">
      <h3>יצירת Repository חדש</h3>
      <div class="field">
        <label for="newRepoName">שם המאגר (Repository Name)</label>
        <input type="text" id="newRepoName" placeholder="my-awesome-app">
      </div>
      <div class="field">
        <label for="newRepoDesc">תיאור (רשות)</label>
        <input type="text" id="newRepoDesc" placeholder="פרויקט שנפתח דרך GitVault Pro">
      </div>
      <div class="toggle">
        <label><input type="checkbox" id="newRepoPrivate" checked> מאגר פרטי (Private)</label>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" class="primary" id="confirmCreateRepoBtn">צור מאגר</button>
        <button type="button" class="secondary-btn" id="cancelCreateRepoBtn" style="flex:none;">ביטול</button>
      </div>
    </div>
  </div>

  <footer class="credit">
    פותח באהבה ע״י — <a href="https://github.com/YSmauas/GitHub-ripo-android" target="_blank" rel="noopener">י.מ. מאואס</a>
  </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const ICON_FILE = '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5Zm6.75.062V4.25c0 .138.112.25.25.25h2.688l-.011-.013-2.914-2.914-.013-.011Z"/></svg>';
  const ICON_DIR = '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg>';
  const modeRadios = document.querySelectorAll('input[name=mode]');
  const newBranchField = $('newBranchField');
  const newBranchInput = $('newBranch');
  const newBranchError = $('newBranchError');

  function isValidRefName(name){
    if (!name) return false;
    if (name.includes('..')) return false;
    if (/[\s~^:?*\[\\\x00-\x1f\x7f]/.test(name)) return false;
    if (name.startsWith('/') || name.endsWith('/')) return false;
    if (name === '@') return false;
    if (name.includes('@{')) return false;
    const parts = name.split('/');
    for (const part of parts){
      if (!part) return false;
      if (part.startsWith('.')) return false;
      if (part.endsWith('.lock')) return false;
      if (part.endsWith('.')) return false;
    }
    return true;
  }

  function validateNewBranch(){
    const mode = document.querySelector('input[name=mode]:checked').value;
    if (mode !== 'pr'){
      newBranchInput.classList.remove('invalid');
      newBranchError.style.display = 'none';
      return true;
    }
    const val = newBranchInput.value.trim();
    if (!val){
      newBranchInput.classList.remove('invalid');
      newBranchError.style.display = 'none';
      return false; // empty is caught separately with its own message at push time
    }
    if (!isValidRefName(val)){
      newBranchInput.classList.add('invalid');
      newBranchError.textContent = 'שם לא תקין: אסורים רווחים, "..", ":" "?" "*" "[" "\\" "~" "^", ואסור להתחיל/להסתיים ב-"/" או ב-".".';
      newBranchError.style.display = '';
      return false;
    }
    newBranchInput.classList.remove('invalid');

  function parseAndApplyGitignore(text) {
    if (!text) return;
    const lines = text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#'));
    
    if (!lines.length) return;

    const combined = Array.from(new Set([...current, ...lines]));
    ignorePatternsInput.value = combined.join(', ');

  }

  function arrayBufferToBase64(buf){
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  async function gitBlobSha1(buf){
    const bytes = new Uint8Array(buf);
    const header = new TextEncoder().encode('blob ' + bytes.length + '\0');
    const full = new Uint8Array(header.length + bytes.length);
    full.set(header, 0);
    full.set(bytes, header.length);
    const hashBuffer = await crypto.subtle.digest('SHA-1', full);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function addOrReplaceEntry(path, buf){
    const base64 = arrayBufferToBase64(buf);
    const gitSha = await gitBlobSha1(buf);
    const existing = entries.find(e => e.path === path);
    if (existing){
      existing.base64 = base64;
      existing.gitSha = gitSha;
      existing.checked = true;
    } else {
      entries.push({ path, base64, gitSha, checked: true });
    }
  }

  async function handleFiles(fileList){
    const files = Array.from(fileList);
    dropText.textContent = 'קורא קבצים ...';
    try{
      for (const file of files){
        const isZip = file.name.toLowerCase().endsWith('.zip') ||
                      file.type === 'application/zip' || file.type === 'application/x-zip-compressed';
        if (isZip){
          const zip = await JSZip.loadAsync(file);
          const paths = []; const tasks = [];
          
          let gitignoreEntry = zip.file('.gitignore') || Object.values(zip.files).find(f => f.name.endsWith('/.gitignore'));
          if (gitignoreEntry) {
            const gText = await gitignoreEntry.async('text');
            parseAndApplyGitignore(gText);
            showToast('נטענו תבניות סינון מתוך .gitignore שבקובץ ה-ZIP', 'info');
          }

          zip.forEach((relPath, zEntry) => {
            if (zEntry.dir) return;
            if (relPath.startsWith('__MACOSX/') || relPath.endsWith('.DS_Store')) return;
            paths.push(relPath);
            tasks.push(zEntry.async('arraybuffer').then(buf => addOrReplaceEntry(relPath, buf)));
          });
          await Promise.all(tasks);

          if (paths.length){
            const first = paths[0].split('/');
            if (first.length > 1){
              const candidate = first[0] + '/';
              if (paths.every(p => p.startsWith(candidate))) commonRoot = candidate;
            }
          }
        } else {
          if (file.name === '.gitignore') {
            const gText = await file.text();
            parseAndApplyGitignore(gText);
            showToast('נטענו תבניות סינון מתוך .gitignore', 'info');
          }
          const relPath = file.webkitRelativePath && file.webkitRelativePath.length ? file.webkitRelativePath : file.name;
          const buf = await file.arrayBuffer();
          await addOrReplaceEntry(relPath, buf);
        }
      }
      stripRootCk.checked = !!commonRoot;
      renderFileList();
      dropText.textContent = entries.length + ' קבצים ברשימה — הקישו כדי להוסיף עוד';
      pushBtn.disabled = entries.length === 0;
      $('pushBtnText').textContent = 'דחיפה ל-GitHub';
      showToast('הקבצים נטענו בהצלחה', 'success');
    }catch(err){
      dropText.textContent = 'שגיאה בקריאת הקבצים';
      showToast('שגיאה בקריאת הקבצים: ' + err.message, 'error');
    }
  }

  function isIgnored(path) {
    const patterns = ignorePatternsInput.value.split(',').map(p => p.trim()).filter(Boolean);
    return patterns.some(pat => {
      let cleanedPat = pat.replace(/^\//, '');
      if (cleanedPat.endsWith('/') && path.includes(cleanedPat)) return true;
      if (cleanedPat.startsWith('*') && path.endsWith(cleanedPat.slice(1))) return true;
      return path.includes(cleanedPat);
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function displayPath(p){
    if (stripRootCk.checked && commonRoot && p.startsWith(commonRoot)){

    }
    return p;
  }

  function renderFileList(){
    fileTreeEl.style.display = entries.length ? '' : 'none';
    $('clearAll').style.display = entries.length ? '' : 'none';
    fileTreeEl.innerHTML = '';

    const filtered = entries.filter(e => !isIgnored(displayPath(e.path)));

      fileTreeEl.innerHTML = '<div style="color:var(--muted); padding:5px;">כל הקבצים סוננו לפי התבניות.</div>';
      return;
    }

    const tree = {};
    filtered.forEach((e) => {
      const parts = displayPath(e.path).split('/');
      let curr = tree;
      parts.forEach((part, i) => {
        if (i === parts.length - 1) {
          curr[part] = { _entry: e, _idx: entries.indexOf(e) };
        } else {
          curr[part] = curr[part] || {};
          curr = curr[part];
        }
      });
    });

    function buildTreeHTML(node) {
      let html = '';
      for (const key in node) {
        if (node[key]._entry) {
          const e = node[key]._entry;
          const i = node[key]._idx;
          const kb = Math.max(1, Math.round(e.base64.length * 0.75 / 1024));
          html += `<div class="tree-file">
            <input type="checkbox" data-i="${i}" ${e.checked ? 'checked' : ''}>
            <span>${ICON_FILE} ${escapeHtml(key)}</span>
            <em>${kb} KB</em>
          </div>`;
        } else {
          html += `<div class="tree-node">
            <div class="tree-folder">${ICON_DIR} ${escapeHtml(key)}/</div>
            <div>${buildTreeHTML(node[key])}</div>
          </div>`;
        }
      }
      return html;
    }

    fileTreeEl.innerHTML = buildTreeHTML(tree);
    fileHint.textContent = filtered.length ? 'קבצים שסומנו ייכללו בקומיט.' : '';
  }

  async function gh(path, token, opts){
    opts = opts || {};
    const res = await fetch('https://api.github.com' + path, {
      method: opts.method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });

    const remaining = res.headers.get('x-ratelimit-remaining');
    const limit = res.headers.get('x-ratelimit-limit');
    if (remaining && limit) {
      $('rateLimitVal').textContent = `${remaining} / ${limit}`;
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok){
      const msg = (data && data.message) ? data.message : ('HTTP ' + res.status);
      throw new Error(path + ': ' + msg);
    }
    return data;
  }

  async function fetchRepoGitignore(fullRepo, base, token) {
    if (!fullRepo || !token) return;
    try {
      const data = await gh(`/repos/${fullRepo}/contents/.gitignore?ref=${base}`, token);
      if (data && data.content) {
        const binary = atob(data.content.replace(/\n/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const text = new TextDecoder('utf-8').decode(bytes);
        parseAndApplyGitignore(text);
        showToast('נטענו תבניות סינון מתוך .gitignore של הריפו הנבחר', 'info');
      }
    } catch (e) {
      // .gitignore does not exist in repo, proceed normally
    }
  }

  downloadRepoBtn.addEventListener('click', async () => {
    const token = $('token').value.trim();
    const fullRepo = repoSelect.value;
    const base = $('base').value.trim() || 'main';

    if (!token || !fullRepo) {
      showToast('נא לבחור ריפו ולהזין טוקן', 'error');
      return;
    }

    downloadRepoBtn.disabled = true;
    logEl.innerHTML = '';
    logEl.style.display = '';
    try {
      // Note: GitHub's zipball endpoint (codeload.github.com) doesn't send CORS
      // headers, so a direct fetch from the browser always fails here. Instead
      // we rebuild the zip ourselves from the Git Data API, which does support CORS.
      log('שולף את עץ הקבצים של ' + base + ' ...', 'info');
      const ref = await gh('/repos/' + fullRepo + '/git/ref/heads/' + base, token);
      const commit = await gh('/repos/' + fullRepo + '/git/commits/' + ref.object.sha, token);
      const treeData = await gh('/repos/' + fullRepo + '/git/trees/' + commit.tree.sha + '?recursive=1', token);
      const blobsOnly = (treeData.tree || []).filter(i => i.type === 'blob');

      if (!blobsOnly.length){
        showToast('הריפו ריק — אין מה להוריד.', 'info');
        return;
      }
      if (treeData.truncated){
        log('שימו לב: עץ הקבצים גדול מדי לשליפה מלאה — ייתכן שחלק מהקבצים לא יכללו ב-ZIP.', 'info');
      }

      log('מוריד ' + blobsOnly.length + ' קבצים ...', 'info');
      showProgress('מוריד קבצים', 0, blobsOnly.length);

      const zip = new JSZip();
      const CONCURRENCY = 5;
      const queue = [...blobsOnly];
      let done = 0;

      async function worker(){
        while (queue.length > 0){
          const item = queue.shift();
          const blobData = await gh('/repos/' + fullRepo + '/git/blobs/' + item.sha, token);
          const cleanBase64 = (blobData.content || '').replace(/\n/g, '');
          zip.file(item.path, cleanBase64, { base64: true });
          done++;
          showProgress('מוריד קבצים', done, blobsOnly.length);
        }
      }
      await Promise.all(Array(Math.min(CONCURRENCY, blobsOnly.length)).fill(0).map(() => worker()));
      log('כל הקבצים נשלפו, בונה ZIP ...', 'ok');
      hideProgress();

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${fullRepo.replace('/', '-')}-${base}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('ההורדה הושלמה!', 'success');
    } catch (err) {
      log('שגיאה בהורדת הריפו: ' + err.message, 'err');
      showToast('שגיאה בהורדת הריפו: ' + err.message, 'error');
      hideProgress();
    } finally {
      downloadRepoBtn.disabled = false;
    }
  });

  async function uploadBlobsConcurrently(chosen, fullRepo, token, prefix) {
    const CONCURRENCY = 5;
    let done = 0;
    const tree = [];
    const queue = [...chosen];

    showProgress('מעלה קבצים (במקביל)', 0, chosen.length);

    async function worker() {
      while (queue.length > 0) {
        const e = queue.shift();
        const blob = await gh('/repos/' + fullRepo + '/git/blobs', token, {
          method: 'POST',
          body: { content: e.base64, encoding: 'base64' }
        });
        let p = displayPath(e.path);
        if (prefix) p = prefix + '/' + p;
        tree.push({ path: p, mode: '100644', type: 'blob', sha: blob.sha });
        
        done++;
        showProgress('מעלה קבצים (במקביל)', done, chosen.length);
        log('קובץ הועלה (' + done + '/' + chosen.length + '): ' + displayPath(e.path), 'info');
      }
    }

    const workers = Array(Math.min(CONCURRENCY, chosen.length)).fill(0).map(() => worker());
    await Promise.all(workers);
    return tree;
  }

  pushBtn.addEventListener('click', async () => {
    resultEl.style.display = 'none';
    logEl.innerHTML = '';
    logEl.style.display = '';
    hideProgress();

    const token = $('token').value.trim();
    const fullRepo = repoSelect.value;
    const base = $('base').value.trim() || 'main';
    const mode = document.querySelector('input[name=mode]:checked').value;
    const newBranch = $('newBranch').value.trim();
    const commitMsg = $('msg').value.trim() || 'עדכון דרך GitVault Pro';
    const prTitle = $('prTitle').value.trim() || commitMsg;
    const prefix = $('prefix').value.trim().replace(/^\/+|\/+$/g, '');

    if (!token || !fullRepo){
      showToast('נא למלא טוקן ולבחור ריפו מהרשימה.', 'error');
      return;
    }
    if (mode === 'pr' && !newBranch){
      showToast('נא למלא שם לברנץ׳ החדש.', 'error');
      return;
    }
    if (mode === 'pr' && !isValidRefName(newBranch)){
      validateNewBranch();
      showToast('שם הברנץ׳ לא תקין — תקנו אותו לפני הדחיפה.', 'error');
      return;
    }
    const chosen = selectedEntries();
    if (!chosen.length){
      showToast('לא נבחרו קבצים (או שכולם סוננו).', 'error');
      return;
    }

    pushBtn.disabled = true;
    $('pushSpinner').style.display = 'inline-block';$('pushBtnText').textContent = 'מעבד דחיפה...';
    const targetBranch = mode === 'pr' ? newBranch : base;

    try{
      log('שולף את ' + base + ' ...', 'info');
      const baseRef = await gh('/repos/' + fullRepo + '/git/ref/heads/' + base, token);
      const baseCommitSha = baseRef.object.sha;

      if (mode === 'pr'){
        log('יוצר ברנץ׳ ' + newBranch + ' ...', 'info');
        try{
          await gh('/repos/' + fullRepo + '/git/refs', token, {
            method: 'POST',
            body: { ref: 'refs/heads/' + newBranch, sha: baseCommitSha }
          });
        }catch(e){
          if (!e.message.includes('Reference already exists')) throw e;
        }
      }

      log('שולף את הברנץ׳ ' + targetBranch + ' ...', 'info');
      const targetRef = await gh('/repos/' + fullRepo + '/git/ref/heads/' + targetBranch, token);
      const parentCommitSha = targetRef.object.sha;
      const parentCommit = await gh('/repos/' + fullRepo + '/git/commits/' + parentCommitSha, token);
      const baseTreeSha = parentCommit.tree.sha;

      log('בודק אילו קבצים השתנו מול הריפו ...', 'info');
      const treeData = await gh('/repos/' + fullRepo + '/git/trees/' + baseTreeSha + '?recursive=1', token);
      if (treeData.truncated){
        log('שימו לב: עץ הקבצים של הריפו גדול מדי לבדיקה מלאה — ייתכן שחלק מהקבצים ייחשבו "השתנו" גם אם לא.', 'info');
      }
      const existingShaByPath = new Map();
      (treeData.tree || []).forEach(item => {
        if (item.type === 'blob') existingShaByPath.set(item.path, item.sha);
      });

      function finalPathFor(e){
        let p = displayPath(e.path);
        return prefix ? prefix + '/' + p : p;
      }

      const changed = [];
      let skippedCount = 0;
      for (const e of chosen){
        const existingSha = existingShaByPath.get(finalPathFor(e));
        if (existingSha && existingSha === e.gitSha){
          skippedCount++;
        } else {
          changed.push(e);
        }
      }
      if (skippedCount > 0){
        log(skippedCount + ' קבצים זהים לגרסה שבריפו — דילוג עליהם (לא יועלו).', 'ok');
      }
      if (changed.length === 0){
        log('אין שינויים לדחוף — כל הקבצים שנבחרו זהים לריפו.', 'ok');
        showToast('אין שינויים לדחוף — כל הקבצים זהים לגרסה הקיימת.', 'info');
        return;
      }

      log('מעלה ' + changed.length + ' קבצים שהשתנו (מתוך ' + chosen.length + ' שנבחרו) במקביל ...', 'info');
      const tree = await uploadBlobsConcurrently(changed, fullRepo, token, prefix);
      log('כל הקבצים הועלו בהצלחה.', 'ok');
      hideProgress();

      log('בונה עץ קבצים חדש ...', 'info');
      const newTree = await gh('/repos/' + fullRepo + '/git/trees', token, {
        method: 'POST',
        body: { base_tree: baseTreeSha, tree: tree }
      });

      log('יוצר קומיט ...', 'info');
      const newCommit = await gh('/repos/' + fullRepo + '/git/commits', token, {
        method: 'POST',
        body: { message: commitMsg, tree: newTree.sha, parents: [parentCommitSha] }
      });

      log('מעדכן את ' + targetBranch + ' ...', 'info');
      try{
        await gh('/repos/' + fullRepo + '/git/refs/heads/' + targetBranch, token, {
          method: 'PATCH',
          body: { sha: newCommit.sha, force: false }
        });
      }catch(refErr){
        if (/fast forward/i.test(refErr.message)){
          throw new Error('זוהתה התנגשות: מישהו אחר דחף שינויים ל-' + targetBranch + ' בדיוק באותו הזמן. הקומיט שלכם נוצר בהצלחה (sha: ' + newCommit.sha.slice(0,7) + ') אך עדיין לא שויך לברנץ׳. פשוט נסו לדחוף שוב — הריצה הבאה תתבסס אוטומטית על הגרסה העדכנית ביותר.');
        }
        throw refErr;
      }

      let resultHtml = 'הקומיט נדחף בהצלחה: ' +
        '<a href="https://github.com/' + fullRepo + '/commit/' + newCommit.sha + '" target="_blank">' +
        newCommit.sha.slice(0,7) + '</a>';

      if (mode === 'pr'){
        log('פותח Pull Request ...', 'info');
        const pr = await gh('/repos/' + fullRepo + '/pulls', token, {
          method: 'POST',
          body: { title: prTitle, head: newBranch, base: base, body: '' }
        });
        resultHtml += '<br>Pull Request: <a href="' + pr.html_url + '" target="_blank">#' + pr.number + '</a>';
      }

      resultEl.innerHTML = resultHtml;
      resultEl.style.display = '';
      showToast('התהליך הושלם בהצלחה!', 'success');
    }catch(err){
      log('שגיאה: ' + err.message, 'err');
      showToast('שגיאה: ' + err.message, 'error');
      hideProgress();
    }finally{
      pushBtn.disabled = false;
      $('pushSpinner').style.display = 'none';$('pushBtnText').textContent = 'דחיפה ל-GitHub';
    }
  });
})();
</script>
</body>
</html>
